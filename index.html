<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home – Jack Simm</title>

  <!-- Poppins font only -->
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet">

  <style>
    /* Root colors */
    :root {
      --text: #1d1d1f;
      --white: #ffffff;
      --accent: #007aff;
      --grey-bg: #f2f2f4; /* for pill behind burger */
    }

    /* Reset */
    * {
      margin: 0; padding: 0; box-sizing: border-box;
    }

    html, body {
      height: 100%;
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, "Segoe UI", Roboto, sans-serif;
      -webkit-font-smoothing: antialiased;
      -moz-osx-font-smoothing: grayscale;
      background: var(--white);
      color: var(--text);
      line-height: 1.5;
    }

    /* HEADER */
    header {
      position: sticky;
      top: 0;
      background: var(--white);
      padding: 16px 20px;
      display: flex;
      align-items: center;
      justify-content: flex-start;
      z-index: 1000;
      /* No box-shadow or border */
      box-shadow: none;
      border-bottom: none;
    }

    /* Burger with grey rounded background */
    #menuToggle {
      background: var(--grey-bg);
      border: none;
      border-radius: 12px;
      padding: 8px 14px;
      font-weight: 600;
      font-size: 1.15rem;
      color: var(--text);
      cursor: pointer;
      user-select: none;
      display: inline-flex;
      align-items: center;
      justify-content: center;
      gap: 8px;
      transition: background-color 0.2s ease;
    }

    #menuToggle:hover,
    #menuToggle:focus {
      background: #e0e0e2;
      outline: none;
    }

    /* DROPDOWN MENU */
    .dropdown {
      position: absolute;
      top: calc(16px + 44px); /* header padding + approx button height */
      left: 20px;
      background: var(--white);
      border-radius: 12px;
      box-shadow: 0 10px 30px rgba(0,0,0,0.08);
      min-width: 160px;
      display: none;
      flex-direction: column;
      padding: 8px 0;
      z-index: 1100;
      font-family: 'Poppins', sans-serif;
    }

    .dropdown.show {
      display: flex;
    }

    .dropdown a {
      padding: 12px 20px;
      text-decoration: none;
      color: var(--text);
      font-weight: 400;
      white-space: nowrap;
      transition: background-color 0.15s ease;
    }

    .dropdown a:hover,
    .dropdown a:focus {
      background-color: #f5f5f7;
      font-weight: 600;
      outline: none;
    }

    /* MAIN CONTENT */
    main {
      max-width: 900px;
      margin: 80px auto 40px;
      padding: 0 20px;
      text-align: center;
    }

    main h1 {
      font-weight: 600;
      font-size: 2.4rem;
      margin-bottom: 18px;
    }

    main p {
      font-weight: 300;
      font-size: 1.05rem;
      color: var(--text);
    }

    /* Responsive */
    @media (max-width: 600px) {
      header {
        padding: 12px 12px;
      }
      .dropdown {
        left: 12px;
        right: 12px;
        min-width: auto;
      }
    }
  </style>
</head>
<body>

  <header>
    <button id="menuToggle" aria-haspopup="true" aria-expanded="false" aria-controls="siteDropdown" aria-label="Main menu">
      ≡ Jack Simm
    </button>

    <nav id="siteDropdown" class="dropdown" role="menu" aria-label="Main navigation">
      <a href="index.html" role="menuitem" tabindex="-1">Home</a>
      <a href="gallery.html" role="menuitem" tabindex="-1">Gallery</a>
      <a href="projects.html" role="menuitem" tabindex="-1">Projects</a>
      <a href="cv.html" role="menuitem" tabindex="-1">CV</a>
    </nav>
  </header>

  <main>
    <h1>Welcome to Jack Simm's Portfolio</h1>
    <p>Explore my work, projects, and CV using the menu in the top-left.</p>
  </main>

  <script>
    (function() {
      const toggle = document.getElementById('menuToggle');
      const menu = document.getElementById('siteDropdown');

      function isOpen() { return menu.classList.contains('show'); }
      function open() {
        menu.classList.add('show');
        toggle.setAttribute('aria-expanded', 'true');
      }
      function close() {
        menu.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }

      toggle.addEventListener('click', e => {
        e.stopPropagation();
        isOpen() ? close() : open();
      });

      toggle.addEventListener('keydown', e => {
        if(e.key === 'Enter' || e.key === ' ') {
          e.preventDefault();
          isOpen() ? close() : open();
        }
        if(e.key === 'Escape') {
          close();
          toggle.focus();
        }
      });

      document.addEventListener('click', e => {
        if (!menu.contains(e.target) && e.target !== toggle) {
          close();
        }
      });

      document.addEventListener('keydown', e => {
        if (e.key === 'Escape') {
          close();
        }
      });
    })();
  </script>

</body>
</html>
