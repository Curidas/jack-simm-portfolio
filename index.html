<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Home – Jack Simm</title>
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@300;400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #1d1d1f;
      --bg: #ffffff;
      --accent: #007aff;
    }

    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    body {
      font-family: 'Poppins', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      font-weight: 300;
      line-height: 1.6;
    }

    header {
      display: flex;
      justify-content: flex-start;
      align-items: center;
      padding: 16px 48px;
      position: sticky;
      top: 0;
      background-color: var(--bg); /* White background, no grey */
      z-index: 100;
    }

    .menu-toggle {
      font-weight: 600;
      font-size: 1.3rem;
      cursor: pointer;
      user-select: none;
      color: var(--text);
      position: relative;
    }

    /* Dropdown styles */
    .dropdown {
      position: absolute;
      top: 56px;
      left: 48px;
      display: none;
      flex-direction: column;
      background-color: transparent; /* NO grey box */
      border-radius: 8px;
      z-index: 1000;
      min-width: 130px;
      /* No box-shadow or background */
    }

    .dropdown a {
      padding: 12px 24px;
      text-decoration: none;
      color: var(--text);
      font-weight: 400;
      border-radius: 6px;
      transition: background-color 0.2s ease;
    }

    .dropdown a:hover,
    .dropdown a:focus {
      background-color: var(--accent);
      color: white;
      outline: none;
    }

    /* Main content */
    main {
      max-width: 900px;
      margin: 60px auto;
      padding: 0 24px;
      text-align: center;
    }

    h1 {
      font-weight: 600;
      font-size: 2.5rem;
      margin-bottom: 24px;
    }

    p {
      font-weight: 300;
      font-size: 1.125rem;
    }

    @media (max-width: 600px) {
      header {
        padding: 16px 16px;
      }
      .dropdown {
        left: 16px;
        top: 48px;
        min-width: 100px;
      }
    }
  </style>
</head>
<body>

<header>
  <div class="menu-toggle" tabindex="0" aria-haspopup="true" aria-expanded="false" aria-controls="dropdownMenu" 
       onclick="toggleDropdown()" onkeydown="handleKey(event)">
    ≡ Jack Simm
  </div>
  <nav id="dropdownMenu" class="dropdown" role="menu" aria-label="Main navigation">
    <a href="index.html" role="menuitem" tabindex="-1">Home</a>
    <a href="gallery.html" role="menuitem" tabindex="-1">Gallery</a>
    <a href="projects.html" role="menuitem" tabindex="-1">Projects</a>
    <a href="cv.html" role="menuitem" tabindex="-1">CV</a>
  </nav>
</header>

<main>
  <h1>Welcome to Jack Simm's Portfolio</h1>
  <p>Explore my work, projects, and designs.</p>
</main>

<script>
  const toggle = document.querySelector(".menu-toggle");
  const menu = document.getElementById("dropdownMenu");

  function toggleDropdown() {
    const isOpen = menu.style.display === "flex";
    menu.style.display = isOpen ? "none" : "flex";
    toggle.setAttribute('aria-expanded', String(!isOpen));
  }

  function handleKey(e) {
    if (e.key === 'Enter' || e.key === ' ') {
      e.preventDefault();
      toggleDropdown();
    }
    if (e.key === 'Escape') {
      menu.style.display = 'none';
      toggle.setAttribute('aria-expanded', 'false');
    }
  }

  document.addEventListener("click", (e) => {
    if (!menu.contains(e.target) && e.target !== toggle) {
      menu.style.display = "none";
      toggle.setAttribute('aria-expanded', 'false');
    }
  });
</script>

</body>
</html>
