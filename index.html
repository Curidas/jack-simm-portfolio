<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Jack Simm – Home</title>
  <link href="https://fonts.googleapis.com/css2?family=SF+Pro+Display:wght@300;400;600&display=swap" rel="stylesheet" />
  <link href="https://fonts.googleapis.com/css2?family=Poppins:wght@400;600&display=swap" rel="stylesheet" />
  <style>
    :root {
      --text: #1d1d1f;
      --bg: #f5f5f7;
      --white: #ffffff;
      --accent: #007aff;
      --line: #d2d2d7;
    }
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }
    body {
      font-family: 'SF Pro Display', -apple-system, BlinkMacSystemFont, 'Segoe UI', Roboto, sans-serif;
      background-color: var(--bg);
      color: var(--text);
      line-height: 1.6;
      font-weight: 300;
    }
    header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      padding: 16px 60px;
      background-color: var(--white);
      box-shadow: 0 1px 4px rgba(0,0,0,0.05);
      position: sticky;
      top: 0;
      z-index: 100;
      user-select: none;
    }
    .logo {
      font-weight: 600;
      font-size: 1.2rem;
      cursor: pointer;
      outline: none;
    }
    /* Dropdown styles */
    .dropdown {
      position: absolute;
      top: 70px;
      left: 60px;
      background-color: var(--white);
      border-radius: 12px;
      box-shadow: 0 8px 30px rgba(0,0,0,0.12);
      display: none;
      flex-direction: column;
      z-index: 999;
      min-width: 160px;
      font-family: 'Poppins', sans-serif;
      font-weight: 400;
      user-select: none;
    }
    .dropdown.show {
      display: flex;
    }
    .dropdown a {
      padding: 14px 24px;
      text-decoration: none;
      color: var(--text);
      font-weight: 400;
      transition: background 0.2s;
    }
    .dropdown a:hover,
    .dropdown a:focus {
      background-color: #f2f2f2;
      outline: none;
    }

    main {
      max-width: 1000px;
      margin: 80px auto;
      padding: 0 20px;
      font-size: 1.1rem;
    }
    h1 {
      font-size: 2.5rem;
      font-weight: 600;
      margin-bottom: 40px;
      text-align: center;
    }
    p {
      max-width: 700px;
      margin: 0 auto;
      line-height: 1.7;
    }
  </style>
</head>
<body>

  <header>
    <div class="logo" tabindex="0" role="button" aria-haspopup="true" aria-expanded="false" aria-controls="dropdownMenu" id="menuToggle">≡ Jack Simm</div>
    <nav class="dropdown" id="dropdownMenu" role="menu" aria-label="Main navigation">
      <a href="index.html" role="menuitem" tabindex="-1">Home</a>
      <a href="gallery.html" role="menuitem" tabindex="-1">Gallery</a>
      <a href="projects.html" role="menuitem" tabindex="-1">Projects</a>
      <a href="cv.html" role="menuitem" tabindex="-1">CV</a>
    </nav>
  </header>

  <main>
    <h1>Welcome to Jack Simm's Portfolio</h1>
    <p>This is the homepage. Explore the gallery, projects, and learn more through the CV page.</p>
  </main>

  <script>
    const toggle = document.getElementById('menuToggle');
    const menu = document.getElementById('dropdownMenu');

    function toggleDropdown() {
      const isOpen = menu.classList.contains('show');
      if (isOpen) {
        menu.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      } else {
        menu.classList.add('show');
        toggle.setAttribute('aria-expanded', 'true');
      }
    }

    toggle.addEventListener('click', toggleDropdown);

    toggle.addEventListener('keydown', e => {
      if (e.key === 'Enter' || e.key === ' ') {
        e.preventDefault();
        toggleDropdown();
      }
      if (e.key === 'Escape') {
        menu.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
        toggle.focus();
      }
    });

    document.addEventListener('click', e => {
      if (!menu.contains(e.target) && e.target !== toggle) {
        menu.classList.remove('show');
        toggle.setAttribute('aria-expanded', 'false');
      }
    });
  </script>
</body>
</html>
